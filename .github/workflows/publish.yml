name: Publish to npm

# 发布方式：GitHub Release → CI 推送到 npm 暂存区（stage）→ 人工 approve 才真正上架
#   1. 在 GitHub Releases 页面创建并发布 Release（tag 必须是 v 前缀且与 package.json version 一致）
#   2. CI 跑测试 + 构建，执行 npm stage publish --provenance，版本进入 npm 暂存队列
#   3. 人工去 npmjs.com 包页 或 CLI 执行 npm stage approve 批准（需 2FA）→ 正式发布
#   优点：每个版本都有人工 + 2FA 把关；缺点：每次发布多一步人工批准
# 认证：npm Trusted Publisher（OIDC），无需 NPM_TOKEN secret。
#       需在 npmjs.com 包设置页 → Publishing Access → Add a GitHub Actions Trusted Publisher
#       仓库：kimihiro233/ucui，workflow 名：publish.yml，权限只需 "npm stage publish"
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC 认证 + npm provenance 来源证明所需

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        # 不设 registry-url：避免 setup-node 生成带 _authToken 的 .npmrc 干扰 OIDC
        # npm 默认 registry 即 https://registry.npmjs.org，stage publish 配合 --provenance 走 Trusted Publisher

      - name: 升级 npm 到 11+（npm stage 命令需要）
        run: |
          npm install -g npm@latest
          echo "npm 版本: $(npm --version)"
          npm stage --help >/dev/null 2>&1 && echo "npm stage 可用" || { echo "npm stage 不可用，npm 版本过低"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      - name: Library build
        run: npm run build

      - name: 校验 tag 与 package.json 版本一致
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json 版本 ($PKG_VERSION) 与 Release tag ($GITHUB_REF_NAME) 不一致，应将 package.json 改为 $TAG_VERSION 后重新发布 Release"
            exit 1
          fi
          echo "暂存版本: $PKG_VERSION (prerelease=${{ github.event.release.prerelease }})"

      - name: 预览打包内容（npm pack dry-run）
        run: npm pack --dry-run

      - name: 推送到 npm 暂存区（stage publish，待人工 approve）
        run: |
          echo "NODE_AUTH_TOKEN 长度: ${#NODE_AUTH_TOKEN}（应为 0，走 OIDC）"
          npm stage publish --provenance
